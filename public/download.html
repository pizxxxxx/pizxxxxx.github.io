<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Скачиваем LomifyNEXT…</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: #0c0b0d;
    color: #9c958e;
    font: 500 13px/1.6 "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.08em;
  }
  .box { text-align: center; }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 10px;
    border-radius: 999px;
    background: #ff4a17;
    vertical-align: middle;
    animation: pulse 1.2s ease infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  a { color: #f6f3f0; }
  .manual { margin: 14px 0 0; font-size: 11px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="box">
  <p><span class="dot"></span><span id="status">ищем последний релиз…</span></p>
  <p class="manual">не началось? <a id="manual" href="https://github.com/pizxxxxx/LomifyNEXT/releases/latest">открой релизы вручную</a></p>
  <noscript><p class="manual">JS выключен — <a href="https://github.com/pizxxxxx/LomifyNEXT/releases/latest">страница релизов</a></p></noscript>
</div>
<script>
(async () => {
  // ?app=mobile ведёт на LomifyNEXT-Mobile (apk), иначе — десктопный exe.
  const mobile = new URLSearchParams(location.search).get("app") === "mobile";
  const repo = mobile ? "pizxxxxx/LomifyNEXT-Mobile" : "pizxxxxx/LomifyNEXT";
  const releasesPage = "https://github.com/" + repo + "/releases/latest";
  const status = document.getElementById("status");
  const manual = document.getElementById("manual");
  manual.href = releasesPage;

  // Приоритет ассетов: точное имя → общий суффикс → любой подходящий файл.
  // Ищем по суффиксам, не по номеру версии: выложил новый релиз — сайт сам
  // подхватит новое имя файла, обновлять ничего не нужно.
  const rules = mobile
    ? [(a) => /arm64\.apk$/i.test(a.name), (a) => /\.apk$/i.test(a.name)]
    : [(a) => /x64-setup\.exe$/i.test(a.name), (a) => /setup\.exe$/i.test(a.name), (a) => /\.exe$/i.test(a.name)];

  // Сигнал отмены — свой на каждый запрос: переиспользованный после таймаута
  // signal мгновенно оборвал бы следующий источник.
  const timeout = () =>
    typeof AbortSignal !== "undefined" && AbortSignal.timeout ? AbortSignal.timeout(9000) : undefined;

  /* Зеркало отдаёт ассеты без полей name и browser_download_url: имя файла
     сидит в конце downloadUrl. Привожу оба формата к одному виду. */
  const normalize = (assets) =>
    (assets || []).map((a) => ({
      name: a.name || String(a.downloadUrl || a.browser_download_url || "").split("/").pop(),
      url: a.browser_download_url || a.downloadUrl,
    }));

  /* Два источника списка файлов последнего релиза — оба смотрят на живые
     данные GitHub и оба отдают CORS-ответы, ни один не хранит номер версии:
     1) api.github.com — официальный API;
     2) ungh.cc — открытое зеркало GitHub API со своими лимитами: выручает,
        когда официальный упёрся в rate limit или недоступен. */
  const sources = [
    async () => {
      const res = await fetch("https://api.github.com/repos/" + repo + "/releases/latest", {
        headers: { Accept: "application/vnd.github+json" },
        signal: timeout(),
      });
      if (!res.ok) throw new Error(String(res.status));
      const rel = await res.json();
      return normalize(rel.assets);
    },
    async () => {
      const res = await fetch("https://ungh.cc/repos/" + repo + "/releases/latest", { signal: timeout() });
      if (!res.ok) throw new Error(String(res.status));
      const data = await res.json();
      if (!data || !data.release) throw new Error("no release");
      return normalize(data.release.assets);
    },
  ];

  for (const source of sources) {
    try {
      const assets = await source();
      let url = null;
      for (const rule of rules) {
        const hit = assets.find(rule);
        if (hit) { url = hit.url; break; }
      }
      if (!url) throw new Error("no asset");
      status.textContent = "начинаем скачивание…";
      location.replace(url);
      return;
    } catch (e) {
      // источник не ответил или не нашёл файл — пробуем следующий
    }
  }

  // Оба источника недоступны — открываю страницу релизов: там всегда лежит
  // самый свежий установщик, до файла останется один клик.
  status.textContent = "не вышло — открываю страницу релизов…";
  location.replace(releasesPage);
})();
</script>
</body>
</html>
